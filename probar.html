<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba el clasificador de residuos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo1: #1a1040; --fondo2: #0b4a5c; --verde: #7cffb2; --amarillo: #ffd93d;
    --rosa: #ff6b9d; --cielo: #4dd9ff; --morado: #8b6cff;
    --texto: #ffffff; --suave: rgba(255,255,255,0.85);
    --vidrio: rgba(255,255,255,0.12); --borde: rgba(255,255,255,0.28);
    --titulo: "Fredoka","Trebuchet MS","Segoe UI",sans-serif;
    --cuerpo: "Nunito","Segoe UI",Arial,sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: var(--cuerpo); font-weight: 600; font-size: 1.15rem;
    color: var(--texto); background: linear-gradient(160deg, var(--fondo1), var(--fondo2)) fixed; line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-family: var(--titulo); font-size: clamp(2rem, 8vw, 2.8rem); line-height: 1.1; margin: 8px 0 6px; text-align: center; }
  h1 span { color: var(--amarillo); }
  .sub { text-align: center; color: var(--suave); margin: 0 0 22px; font-size: 1.15rem; }
  .tarjeta { background: var(--vidrio); border: 2px solid var(--borde); border-radius: 24px; padding: 18px; }
  .boton {
    display: block; width: 100%; border: 0; border-radius: 999px; padding: 16px 20px; cursor: pointer;
    font-family: var(--titulo); font-size: 1.4rem; font-weight: 600; color: #2b1f6b; background: var(--amarillo);
  }
  .boton:disabled { opacity: 0.6; cursor: wait; }
  .boton.sec { background: var(--cielo); margin-top: 12px; }
  input[type=file] { display: none; }
  #vista { display: none; width: 100%; max-height: 320px; object-fit: contain; border-radius: 16px; margin-top: 16px; background: rgba(0,0,0,0.25); }
  #estado { text-align: center; font-size: 1.2rem; margin-top: 16px; min-height: 1.5em; }
  .giro { display: inline-block; animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  #resp {
    display: none; margin-top: 16px; background: #ffffff; color: #1d1840; border-radius: 20px;
    padding: 18px 20px; font-size: 1.2rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  #resp b { color: #2b1f6b; }
  #resp.aviso { background: #fff3cd; }
  .pie { text-align: center; color: var(--suave); font-size: 1rem; margin-top: 22px; }
  .pie a { color: var(--verde); }
</style>
</head>
<body>
<main>
  <h1>♻️ Clasificador de <span>residuos</span></h1>
  <p class="sub">Toma o elige la foto de un residuo y mira qué te responde la IA.</p>

  <div class="tarjeta">
    <button type="button" class="boton" id="btnCam">📸 Tomar foto</button>
    <button type="button" class="boton sec" id="btnGal">🖼️ Elegir de la galería</button>
    <input type="file" id="inCam" accept="image/*" capture="environment">
    <input type="file" id="inGal" accept="image/*">
    <img id="vista" alt="Foto que vas a enviar">
    <div id="estado" role="status" aria-live="polite"></div>
    <div id="resp" aria-live="polite"></div>
  </div>

  <p class="pie">Tip: fotografía un solo objeto, con buena luz y fondo liso.<br>
  Desarrollo Sustentable · Instituto Tecnológico de Mazatlán<br>
  <a href="./">← Volver a la página principal</a></p>
</main>
<script>
(function () {
  var URL_HOOK = "https://hook.us2.make.com/dv7h76lhjjm5i3fnlx1n9cq4kmgvq8ld";
  var estado = document.getElementById("estado");
  var resp = document.getElementById("resp");
  var vista = document.getElementById("vista");
  var botones = [document.getElementById("btnCam"), document.getElementById("btnGal")];
  var inCam = document.getElementById("inCam"), inGal = document.getElementById("inGal");

  botones[0].addEventListener("click", function () { inCam.click(); });
  botones[1].addEventListener("click", function () { inGal.click(); });
  inCam.addEventListener("change", function () { elegir(inCam); });
  inGal.addEventListener("change", function () { elegir(inGal); });

  function ocupado(s) { botones.forEach(function (b) { b.disabled = s; }); }
  function aviso(txt) {
    resp.className = "aviso"; resp.style.display = "block"; resp.textContent = txt;
  }
  function mostrar(texto) {
    // Solo se permiten <b> e <i>; todo lo demás se escapa.
    var seguro = texto.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/&lt;(\/?)(b|i)&gt;/g, "<$1$2>");
    resp.className = ""; resp.style.display = "block"; resp.innerHTML = seguro;
  }
  function reducir(archivo) {
    return new Promise(function (ok, mal) {
      var url = URL.createObjectURL(archivo);
      var img = new Image();
      img.onload = function () {
        var max = 1024, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        var data = c.toDataURL("image/jpeg", 0.8);
        vista.src = data; vista.style.display = "block";
        URL.revokeObjectURL(url);
        ok(data.split(",")[1]);
      };
      img.onerror = function () { URL.revokeObjectURL(url); mal(new Error("imagen")); };
      img.src = url;
    });
  }
  function elegir(input) {
    var f = input.files && input.files[0];
    input.value = "";
    if (!f) return;
    resp.style.display = "none";
    ocupado(true);
    estado.innerHTML = '<span class="giro">♻️</span> Analizando tu foto…';
    reducir(f).then(function (b64) {
      var ctrl = new AbortController();
      var t = setTimeout(function () { ctrl.abort(); }, 70000);
      return fetch(URL_HOOK, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "foto=" + encodeURIComponent(b64),
        signal: ctrl.signal
      }).then(function (r) {
        clearTimeout(t);
        return r.text().then(function (txt) { return { status: r.status, txt: txt }; });
      });
    }).then(function (r) {
      estado.textContent = "";
      if (r.status === 429 || r.txt.trim() === "limite") {
        aviso("🛑 Límite de pruebas alcanzado. ¡Gracias por participar en la expo! 🙌");
      } else if (r.status === 200 && /<b>/.test(r.txt)) {
        mostrar(r.txt);
      } else {
        aviso("😴 El servicio está apagado por ahora. Avísale a quien te dio el código.");
      }
    }).catch(function () {
      estado.textContent = "";
      aviso("😕 No se pudo analizar la foto. Revisa tu internet y vuelve a intentarlo.");
    }).then(function () { ocupado(false); });
  }
})();
</script>
</body>
</html>
